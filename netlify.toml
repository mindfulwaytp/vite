[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Cache Chrome downloads in the repo dir so Netlify's build cache picks it up between builds
  PUPPETEER_CACHE_DIR = "/opt/build/repo/.cache/puppeteer"

[dev]
  command = "vite"
  targetPort = 5173
  port = 8888
  autoLaunch = true
  functions = "netlify/functions"

# Provider URL redirects (when a provider's name changes, redirect old slug to new)
[[redirects]]
  from = "/providers/mccall-evans"
  to = "/providers/james-mccall-evans"
  status = 301

# SPA fallback — non-forced so static files (e.g., pre-rendered blog posts) are served first.
# Specific rules above must come BEFORE this catch-all.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
