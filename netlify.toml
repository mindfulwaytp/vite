[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "vite"
  targetPort = 5173
  port = 8888
  autoLaunch = true
  functions = "netlify/functions"

# SPA fallback — non-forced so static files (e.g., pre-rendered blog posts) are served first
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
