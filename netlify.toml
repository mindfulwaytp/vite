[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Cache Chrome downloads in the repo dir so Netlify's build cache picks it up between builds
  PUPPETEER_CACHE_DIR = "/opt/build/repo/.cache/puppeteer"

[dev]
  command = "vite"
  targetPort = 5173
  port = 8888
  autoLaunch = true
  functions = "netlify/functions"

# Provider URL redirects (when a provider's name changes, redirect old slug to new)
[[redirects]]
  from = "/providers/mccall-evans"
  to = "/providers/james-mccall-evans"
  status = 301

# Service/specialty URL history. Every rule points at the FINAL destination —
# never at another redirect — so no request is ever bounced twice.
#
# Two /services pages were empty stubs duplicating fuller pages; the rest moved
# when services (how care is delivered) and specialties (what we help with)
# were split into separate sections.

# -> /services/autism-adhd-assessments
[[redirects]]
  from = "/services/adhd-autism-evaluations"
  to = "/services/autism-adhd-assessments/"
  status = 301

[[redirects]]
  from = "/neurodiversity/assessments"
  to = "/services/autism-adhd-assessments/"
  status = 301

# -> /specialties/autism-adhd-therapy
[[redirects]]
  from = "/services/neurodivergent-affirming-therapy"
  to = "/specialties/autism-adhd-therapy/"
  status = 301

[[redirects]]
  from = "/neurodiversity/affirming-therapy"
  to = "/specialties/autism-adhd-therapy/"
  status = 301

# -> /specialties/*
[[redirects]]
  from = "/services/queer-affirming-therapy"
  to = "/specialties/queer-affirming-therapy/"
  status = 301

[[redirects]]
  from = "/services/polyamory-non-monogamy"
  to = "/specialties/polyamory-non-monogamy/"
  status = 301

# Cost and resource pages moved out from under /contact and /neurodiversity.
# "ratesfees" also had no separator, so "rates" and "fees" were invisible as words.
[[redirects]]
  from = "/contact/ratesfees"
  to = "/rates-fees/"
  status = 301

[[redirects]]
  from = "/contact/affording-therapy"
  to = "/affording-therapy/"
  status = 301

[[redirects]]
  from = "/neurodiversity/neurodiversity-resources"
  to = "/resources/"
  status = 301

[[redirects]]
  from = "/neurodiversity/neurodiversity-resources/*"
  to = "/resources/:splat"
  status = 301

# SPA fallback — non-forced so static files (e.g., pre-rendered blog posts) are served first.
# Specific rules above must come BEFORE this catch-all.
# Targets app-shell.html, not index.html: index.html carries the pre-rendered home
# page body, which would otherwise be served for every unmatched route.
[[redirects]]
  from = "/*"
  to = "/app-shell.html"
  status = 200
